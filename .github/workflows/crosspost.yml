name: Cross-post Expo blog to Dev.to

on:
  schedule:
    # Daily at 12:00 PM PT (19:00 UTC, or 20:00 UTC during DST)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crosspost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Run cross-post script
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_ORG_ID: ${{ secrets.DEVTO_ORG_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 crosspost.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "Update posted.json state"
          git push
